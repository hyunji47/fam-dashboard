<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com https://open.neis.go.kr https://api.github.com https://raw.githubusercontent.com; font-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>우리집 대시보드</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--card2:#f1f4f9;--text:#1d2330;--sub:#6b7385;--line:#e4e8ef;--bd:#e4e8ef;--accent:#2f6bff;--accent2:color-mix(in srgb,var(--accent) 13%,var(--card));--danger:#e5484d;--ok:#1f9d55;--warn:#d98a00;--shadow:0 1px 3px rgba(20,30,60,.06)}
:root[data-tone=dark]{--bg:#0e1117;--card:#171b24;--card2:#1e2330;--text:#eef1f7;--sub:#9aa3b5;--line:#2a3140;--bd:#2a3140;--danger:#ff6b70;--ok:#4cc27e;--warn:#f5b53d;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.app{display:flex;min-height:100vh;min-height:100dvh}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));overflow-x:auto}
nav#nav button{flex:1 0 auto;min-width:54px;border:0;background:none;padding:6px 4px;border-radius:12px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav#nav button .i{line-height:0;display:block}
nav#nav button .i svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#nav button .i svg .f{fill:currentColor;fill-opacity:.16;stroke:none}
nav#nav button.on .i svg .f{fill-opacity:.3}
nav#nav button.on{color:var(--accent);background:var(--accent2);font-weight:700}
main{flex:1;min-width:0;padding:calc(12px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto;width:100%}
@media(min-width:900px){nav#nav{position:sticky;top:0;bottom:auto;height:100vh;width:128px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 8px;gap:2px;overflow:visible}nav#nav button{flex:0 0 auto;flex-direction:row;font-size:14px;gap:10px;padding:10px 12px;justify-content:flex-start}main{padding:20px 24px 40px}.app{flex-direction:row}}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h1{font-size:20px;flex:1}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--sub);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card h2 .sp{flex:1}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:1fr 1fr 1fr}}
.muted{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:3px 0 8px}
textarea{min-height:80px;resize:vertical}
label.l{font-size:12px;color:var(--sub);display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);padding:4px 11px;border-radius:99px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--accent2);border-color:var(--accent);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.ev:first-of-type{border-top:0}
.ev .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev .t{font-weight:600}
.empty{color:var(--sub);text-align:center;padding:14px 0;font-size:13px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .h{background:var(--card2);text-align:center;font-size:12px;padding:5px 0;color:var(--sub)}
.cal .d{background:var(--card);min-height:62px;padding:3px 3px 2px;cursor:pointer;overflow:hidden}
@media(min-width:760px){.cal .d{min-height:96px}}
.cal .d.o{opacity:.4}
.cal .d .n{font-size:12px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal .d.today .n{background:var(--accent);color:#fff;font-weight:700}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d.sun .n{color:var(--danger)}.cal .d.sat .n{color:var(--accent)}
.cal .tag{font-size:10.5px;line-height:1.25;border-radius:4px;padding:0 3px;margin-top:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:10px;color:var(--sub)}
@media(max-width:600px){.cal .tag{font-size:0;height:6px;width:6px;border-radius:50%;padding:0;display:inline-block;margin:1px 1px 0 0}}
/* todo */
.todo{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.todo.done .tx{text-decoration:line-through;color:var(--sub)}
.todo .tx{flex:1;min-width:0;word-break:break-word}
/* timetable */
.tt{display:grid;grid-template-columns:34px repeat(5,1fr);gap:2px;font-size:13px}
.tt>div{background:var(--card2);border-radius:8px;padding:6px 3px;text-align:center;min-height:42px;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.tt .hd{min-height:30px;font-weight:700;background:none;color:var(--sub)}
.tt .hd.today{color:var(--accent)}
.tt .c{cursor:pointer;background:var(--card);border:1px solid var(--line)}
.tt .c.today{background:var(--accent2);border-color:var(--accent)}
.tt .c.now{box-shadow:0 0 0 2px var(--accent)}
/* meals */
.meal{padding:8px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal.today{background:var(--accent2);margin:0 -8px;padding:8px;border-radius:10px;border-top:0}
.meal b{display:block;font-size:13px;margin-bottom:2px}
.meal span.a{font-size:10px;color:var(--sub)}
/* health */
.vrow{padding:8px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0}
.dose{display:inline-flex;flex-direction:column;align-items:center;margin:3px 4px 3px 0;padding:3px 9px;border-radius:10px;font-size:12px;border:1px solid var(--line);cursor:pointer;background:var(--card);min-width:56px;line-height:1.3}
.dose small{font-size:10px;color:var(--sub)}
.dose.done{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:var(--ok)}
.dose.due{background:var(--accent2);border-color:var(--accent)}
.dose.over{background:color-mix(in srgb,var(--danger) 14%,var(--card));border-color:var(--danger)}
.dose.fut{opacity:.55}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.5);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){#modal{align-items:center}#modal .box{border-radius:20px}}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:.95}
.wx{display:flex;align-items:center;gap:12px}
.wx .big{font-size:38px;line-height:1}
.wx .tt2{font-size:26px;font-weight:700}
.fc{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.fc div{flex:1 0 54px;text-align:center;background:var(--card2);border-radius:10px;padding:6px 2px;font-size:12px}
.notice{padding:10px 0;border-top:1px solid var(--line)}
.notice:first-of-type{border-top:0}
.notice .b{white-space:pre-wrap;word-break:break-word;margin-top:4px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
@media(min-width:900px){.fab{bottom:24px;right:28px}}

/* ===== 심플 테마 ===== */
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on{background:var(--accent2);border-color:var(--accent);font-weight:700}
nav#nav button{white-space:nowrap}
nav#nav button.on{background:var(--accent2);color:var(--accent)}
.cal .d.today .n{background:var(--accent);color:#fff}
.cal .d.sel{outline-color:var(--accent)}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:15px;flex:none}
.stars{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin:2px 0 6px}
.prog i{display:block;height:100%;background:var(--mc,var(--accent));border-radius:99px;transition:width .3s}
.pc{border-top:3px solid var(--mc,var(--accent))}
.qa{margin:0!important;font-size:14px}
.per{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:8px;padding:2px 9px 2px 3px;margin:2px 4px 2px 0;font-size:13px}
.per b{background:var(--accent);color:#fff;border-radius:6px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.sg{display:grid;grid-template-columns:repeat(var(--nd,5),1fr);gap:8px}
.sgc{min-width:0}.sgc h3{font-size:13px;margin:0 0 6px;text-align:center;color:var(--sub)}.sgc.today h3{color:var(--accent)}
.sev{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:6px 8px;margin-bottom:6px;cursor:pointer;font-size:13px}
.sev.k-academy{border-left-color:#e08a00}.sev.k-etc{border-left-color:#8a8fa3}.sev.now{box-shadow:0 0 0 2px var(--accent)}
.sev .tm{font-size:11.5px;color:var(--sub)}.sev .ti{font-weight:600;word-break:keep-all}.sev .pl{font-size:11.5px;color:var(--sub)}
.dtabs{display:none}
@media(max-width:700px){.sg{display:block}.sgc:not(.sel){display:none}.sgc h3{display:none}.dtabs{display:flex}}
.per b.tm{padding:0 5px;min-width:0;font-size:11px}
.ttk{padding:6px 0;border-top:1px solid var(--line)}
.ttk:first-of-type{border-top:0}
/* ===== 와이드(한눈에) 홈 ===== */
.hero{padding:12px 18px}
.hero .row{gap:16px}
.hero .date{font-size:22px;font-weight:700;line-height:1.2}
.hero .clk{font-size:34px;font-weight:300;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.hero .hi{font-size:13px;color:var(--sub)}
.hero .wxs{display:flex;align-items:center;gap:10px;margin-left:auto}
.hero .wxs .ic{font-size:30px}
.hero .wxs b{font-size:22px}
.hero .fc2{display:flex;gap:6px}
.hero .fc2 div{text-align:center;font-size:12px;background:var(--card2);border-radius:10px;padding:3px 8px}
.hero .wxs .sub2{font-size:12px;color:var(--sub)}
.wide{display:grid;gap:12px;grid-template-columns:1fr}
.wide .whead{margin:0}
.wide .col{min-width:0}
@media(min-width:1000px){
  main:has(.wide){max-width:none;padding:14px 18px 12px}
  .wide{grid-template-columns:var(--c1,1.18fr) 12px var(--c2,1fr) 12px var(--c3,1.05fr);column-gap:0;row-gap:12px;grid-template-rows:auto minmax(0,1fr);height:calc(100dvh - 26px);align-items:stretch}
  .wide .rz{display:block;cursor:col-resize;position:relative;touch-action:none}
  .wide .rz::after{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--line);transition:.15s}
  .wide .rz:hover::after,.wide .rz.drag::after{background:var(--accent);left:4px;width:4px}
  .wide .whead{grid-column:1/-1}
  .wide .col{overflow-y:auto;min-height:0;padding:2px 6px 10px 2px}
  .wide .card{margin-bottom:14px}
  .wide .cal .d{min-height:76px}
}
@media(min-width:1000px) and (max-height:760px){.wide .cal .d{min-height:58px}}
/* 공휴일 */
.cal .tag.hd{background:none;color:var(--danger);font-weight:600;padding-left:1px}
.cal .tag.sm2{background:none;color:var(--sub)}
.cal .d.hol .n{color:var(--danger)}
@media(max-width:600px){.cal .tag.hd{background:var(--danger)}.cal .tag.sm2{background:var(--sub)}}
/* 가족 대화 */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.bw{max-width:78%;min-width:0}
.msg.me .bw{text-align:right}
.nm{font-size:11px;color:var(--sub);margin:0 4px 2px}
.bb{display:inline-block;text-align:left;background:var(--card2);padding:8px 12px;border-radius:16px 16px 16px 4px;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.msg.me .bb{background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px}
.dsep{text-align:center;font-size:12px;color:var(--sub);margin:6px 0}
.compose{display:flex;gap:6px;align-items:flex-end;margin-top:10px;background:var(--card2);border:2px solid var(--accent);border-radius:16px;padding:8px}
.compose select{width:auto;margin:0;padding:8px 6px;max-width:30%}
.compose textarea{margin:0;min-height:40px;height:40px;flex:1;resize:none;background:var(--card);border:1px solid var(--line);border-radius:12px}
.compose select{background:var(--card);border-radius:12px}
.compose .btn{height:40px}
#chatpage .compose{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card2);box-shadow:0 -6px 12px -8px rgba(0,0,0,.25)}
.chbar{display:flex;align-items:center;gap:6px;margin-bottom:8px}.chbar b{flex:1;text-align:center}
.cal .d.cnt{min-height:44px}.chatcal .cal .d{position:relative}.cal .d .c{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#f08a24;font-size:0;padding:0;margin:0}
.chatcal .cal .d{min-height:44px;text-align:center}.chatcal .cal .d .n{margin:0 auto}
.schk{padding:8px 0;border-top:1px solid var(--line)}.schk:first-of-type{border-top:0}.schk .lunch{margin-top:6px;font-size:15px;background:var(--card2);border-radius:10px;padding:8px 10px}
@media(min-width:900px){#chatpage .compose{bottom:8px}}
.themeBox .rowsw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 4px}
.themeBox .sw{width:32px;height:32px;margin:0;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:none;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.themeBox .sw.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--card)}
.themeBox .sw.def{background:var(--bg);color:var(--text)}
.themeBox input[type=color]{-webkit-appearance:none;appearance:none;width:32px;height:32px;padding:0;margin:0;flex:none;border:2px solid var(--line);border-radius:50%;overflow:hidden;background:none;cursor:pointer}
.themeBox input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.themeBox input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.themeBox input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.themeBox .lbl2{font-size:12px;color:var(--sub);margin-top:10px}
nav#nav button.on,.chip.on{background:var(--card);color:var(--accent);border-color:var(--accent);opacity:1}
nav#nav button.on{box-shadow:0 2px 10px -2px rgba(0,0,0,.25);border:1px solid var(--line)}
.chip:not(.on){opacity:.5}
.chip:not(.on):hover{opacity:.85}
.chip.on{border-width:2px;font-weight:700}
.chip.on .muted{color:var(--sub)}
.btn.sm.pri{color:#fff}
.compose .btn.pri{background:var(--text);border-color:var(--text);color:var(--card)}
.cal .d.o{opacity:1;background:var(--card)}
.cal .d.o .n,.cal .d.o .tag{opacity:.35}
.chatcal .cal .d{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.chatcal .cal .d .n{margin:0}
@media(max-width:899px){
.hero .row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.hero .clk{grid-column:2;grid-row:1;text-align:right;font-size:32px}
.hero .row>div:first-child{grid-column:1;grid-row:1;min-width:0}
.hero .wxs{grid-column:1;grid-row:2;margin:0;min-width:0}
.hero .row>.btn{grid-column:2;grid-row:2;justify-self:end}
.hero .fc2{grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hero .fc2 div{padding:4px 2px}
}
.chips.one{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:4px}.chips.one::-webkit-scrollbar{display:none}.chips.one .chip{flex:0 0 auto;white-space:nowrap;padding:4px 9px;font-size:12.5px}
.hs{position:relative;display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;margin-top:6px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hi2{flex:0 0 auto;min-width:96px;max-width:150px;background:var(--card2);border-radius:10px;padding:6px 9px;font-size:13px}
.hi2.now{background:var(--accent2);border-left:4px solid var(--accent)}.hi2.now.k-academy{border-left-color:#e08a00}.hi2.now.k-etc{border-left-color:#8a8fa3}
.hi2 .tm{font-size:11.5px;color:var(--sub);white-space:nowrap}.hi2 .ti{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hi2 .pl{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav#nav button .i{color:inherit}
nav#nav button .i svg .f{fill-opacity:.2}
nav#nav button.on .i svg .f{fill-opacity:.35}
.rz{display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
@media(max-width:600px){.cal .tag.hd{font-size:9.5px;height:auto;width:auto;border-radius:0;display:block;padding:0;margin:1px 0 0;background:none;color:var(--danger);line-height:1.2;font-weight:700}}
.cal .d{position:relative}.cal .edot{display:none;position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%}
@media(max-width:600px){.hcal .edot{display:block}.hcal .tag:not(.hd):not(.sm2){display:none}.hcal .more{display:none}.hcal .d{min-height:46px;padding-top:2px}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ 유틸 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x};
const TODAY=()=>ymd(new Date());
const DOW=['일','월','화','수','목','금','토'];
const fmtK=s=>{const d=pd(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일('+DOW[d.getDay()]+')'};
const fmtY=s=>{const d=pd(s);return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()};
const fmtKY=s=>{const d=pd(s);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일('+DOW[d.getDay()]+')'};
const fmtS=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
const COLORS=['#2f6bff','#e5484d','#1f9d55','#e08a00','#9b51e0','#e5489b','#0ea5a5','#6b7385'];
const EMOJI=['👨','👩','👦','👧','👶','🧒','👴','👵','🐶'];
let toastT;function toast(m,ms=2200){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ============ 데이터 ============ */
const LISTS=['members','events','todos','notices','chat','tt','sched','health','checks'];
const K_DATA='famdash.data.v1',K_GH='famdash.gh',K_ME='famdash.me',K_UI='famdash.ui';
const blank=()=>({v:1,members:[],events:[],todos:[],notices:[],tt:[],sched:[],health:[],checks:[],settings:{u:0,wx:{name:'서울',lat:37.5665,lon:126.978}}});
let D=Object.assign(blank(),lsGet(K_DATA,{}));
LISTS.forEach(l=>{if(!Array.isArray(D[l]))D[l]=[]});
if(!D.settings)D.settings=blank().settings;
let UI=Object.assign({tab:'home',month:TODAY().slice(0,7),sel:TODAY(),calView:'month',todoM:null,ttM:null,hM:null,mealOff:0,calF:[],color:'#2f6bff',mode:'auto',bg:'',who:'',chatDay:'',chatCal:false,chatMonth:'',ttDay:-1,mealTab:''},lsGet(K_UI,{}));
let ME=lsGet(K_ME,null);if(UI.tab==='board')UI.tab='chat';
const saveUI=()=>lsSet(K_UI,UI);
const live=l=>D[l].filter(x=>!x.del);
const mem=id=>D.members.find(m=>m.id===id&&!m.del);
const members=()=>live('members');
const kids=()=>members().filter(m=>m.role==='child');
let dirty=false;
function saveLocal(){lsSet(K_DATA,D)}
function upsert(list,o){o.u=Date.now();const i=D[list].findIndex(x=>x.id===o.id);if(i<0)D[list].push(o);else D[list][i]=o;changed()}
function removeItem(list,id){const o=D[list].find(x=>x.id===id);if(o){o.del=true;o.u=Date.now();}changed()}
function setSettings(p){D.settings=Object.assign({},D.settings,p,{u:Date.now()});changed()}
function changed(){dirty=true;saveLocal();render();schedulePush()}
function merge(a,b){
  const out=JSON.parse(JSON.stringify(a));
  LISTS.forEach(l=>{const map=new Map((out[l]||[]).map(x=>[x.id,x]));
    (b[l]||[]).forEach(r=>{const c=map.get(r.id);if(!c||(r.u||0)>(c.u||0))map.set(r.id,r)});
    const cut=Date.now()-60*864e5;
    out[l]=[...map.values()].filter(x=>!(x.del&&(x.u||0)<cut))});
  if(((b.settings||{}).u||0)>((out.settings||{}).u||0))out.settings=b.settings;
  return out}
const sig=d=>LISTS.map(l=>(d[l]||[]).map(x=>x.id+':'+(x.u||0)).sort().join(',')).join('|')+'#'+((d.settings||{}).u||0);

/* ============ GitHub 동기화 (여행 플래너와 같은 방식) ============ */
const GHN=/^[A-Za-z0-9_.-]{1,100}$/;
const gh=()=>{const g=lsGet(K_GH,null);return g&&GHN.test(g.owner||'')&&GHN.test(g.repo||'')?g:null};
const ghUrl=g=>'https://api.github.com/repos/'+g.owner+'/'+g.repo+'/contents/'+(g.path||'data/family.json');
const b64=s=>{let x='';new TextEncoder().encode(s).forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
let S={busy:false,at:0,err:'',sha:null,state:gh()?(gh().token?'rw':'ro'):'local'};
async function ghPull(g){
  const h={'Accept':'application/vnd.github+json'};if(g.token)h.Authorization='Bearer '+g.token;
  const r=await fetch(ghUrl(g)+'?t='+Date.now(),{headers:h,cache:'no-store'});
  if(r.status===404){S.sha=null;return null}
  if(!r.ok)throw new Error('pull '+r.status);
  const j=await r.json();S.sha=j.sha;
  const txt=j.content?unb64(j.content):await (await fetch(j.download_url,{cache:'no-store'})).text();
  return JSON.parse(txt)}
async function ghPush(g){
  if(!g.token)throw new Error('no token');
  for(let k=0;k<2;k++){
    const body={message:'update family data',content:b64(JSON.stringify(D))};if(S.sha)body.sha=S.sha;
    const r=await fetch(ghUrl(g),{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+g.token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){S.sha=(await r.json()).content.sha;return}
    if(r.status!==409&&r.status!==422)throw new Error('push '+r.status);
    const rem=await ghPull(g);if(rem)D=merge(D,rem)}
  throw new Error('conflict')}
function ghHint(e){const m=String(e&&e.message||e);const c=(m.match(/\b(\d{3})\b/)||[])[1];
  if(c==='401')return '토큰이 올바르지 않거나 만료됐어요 (401)';
  if(c==='403')return '토큰 권한 또는 호출 한도 문제예요 (403)';
  if(c==='404')return '저장소를 찾지 못했거나 토큰에 권한이 없어요 (404)';
  if(/conflict/.test(m))return '동시에 저장해서 충돌했어요. 잠시 뒤 다시 시도하세요';
  if(/Failed to fetch|Load failed|NetworkError/i.test(m))return '네트워크가 끊겼어요';
  return m.slice(0,60)}
async function sync(manual){
  const g=gh();if(!g||S.busy)return;S.busy=true;
  try{
    const rem=await ghPull(g);
    if(rem){const before=sig(D);const m=merge(D,rem);const changedLocal=sig(m)!==before;D=m;
      if(changedLocal){saveLocal();if(!modalOpen())render()}
      if(g.token&&(dirty||sig(D)!==sig(rem)))await ghPush(g)}
    else if(g.token)await ghPush(g);
    dirty=false;S.at=Date.now();S.err='';if(manual)toast('동기화했어요 ✓')
  }catch(e){S.err=ghHint(e);if(manual)toast('동기화 실패: '+S.err,4000)}
  S.busy=false;updateBadge()}
let pushT;function schedulePush(){if(!gh()||!gh().token)return;clearTimeout(pushT);pushT=setTimeout(()=>sync(false),2500)}
setInterval(()=>{if(!document.hidden&&gh()&&!modalOpen())sync(false)},60000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)UNLOCK=false;else sync(false)});
function updateBadge(){const b=$('#badge');if(!b)return;
  const g=gh();
  if(!g){b.className='pill';b.textContent='이 기기에만 저장'}
  else if(S.err){b.className='pill bad';b.textContent='⚠ '+S.err}
  else{b.className='pill ok';b.textContent=(g.token?'':'읽기 전용 · ')+(S.at?'동기화 '+new Date(S.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'동기화 중…')}}

/* ============ 모달 ============ */
const modalOpen=()=>$('#modal').classList.contains('on');
function openModal(h){$('#box').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#box').innerHTML='';render()}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
const val=id=>($('#'+id)||{}).value||'';

/* ============ 공통 조각 ============ */
const memDot=m=>m?`<span class="dot" style="background:${esc(m.color)}"></span>`:`<span class="dot" style="background:#8a93a6"></span>`;
const memLabel=m=>m?`${esc(m.emoji||'')} ${esc(m.name)}`:'온 가족';
function memChips(sel,act,multi,all){return `<div class="chips ${act==='calF'?'one':''}">`+(all?`<span class="chip ${sel.length===0?'on':''}" data-a="${act}" data-id="">${multi?'온 가족':'전체'}</span>`:'')+members().map(m=>`<span class="chip ${sel.includes(m.id)?'on':''}" data-a="${act}" data-id="${m.id}">${memDot(m)}${esc(m.name)}</span>`).join('')+`</div>`}
const HC={};
const LUN=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric'});
function lunar(d){let m=0,dd=0,leap=false;for(const p of LUN.formatToParts(d)){if(p.type==='month'){leap=/bis|윤/i.test(p.value);m=parseInt(p.value,10)}else if(p.type==='day')dd=parseInt(p.value,10)}return{m,d:dd,leap}}
const TEMPH={'2025-01-27':'임시공휴일','2025-06-03':'대통령선거일','2026-06-03':'전국동시지방선거일'};
function holidays(y){
  if(HC[y])return HC[y];
  const map={};const add=(ds,n,o)=>{(map[ds]=map[ds]||[]).push(Object.assign({n,hol:true},o||{}))};
  const fx=(m,d,n,sub)=>add(y+'-'+pad(m)+'-'+pad(d),n,{sub});
  fx(1,1,'신정');fx(3,1,'삼일절',1);fx(5,5,'어린이날',1);fx(6,6,'현충일');if(y>=2026)fx(7,17,'제헌절');fx(8,15,'광복절',1);fx(10,3,'개천절',1);fx(10,9,'한글날',1);fx(12,25,'성탄절',1);
  const put=(dt,n,o)=>{const x=ymd(dt);if(x.slice(0,4)===String(y))add(x,n,o)};
  for(let t=new Date(y-1,11,20);t<=new Date(y+1,0,6);t=addD(t,1)){
    const L=lunar(t);if(L.leap)continue;
    if(L.m===1&&L.d===1){put(addD(t,-1),'설날 연휴',{grp:'seol'});put(t,'설날',{grp:'seol'});put(addD(t,1),'설날 연휴',{grp:'seol'})}
    else if(L.m===8&&L.d===15){put(addD(t,-1),'추석 연휴',{grp:'chu'});put(t,'추석',{grp:'chu'});put(addD(t,1),'추석 연휴',{grp:'chu'})}
    else if(L.m===4&&L.d===8)put(t,'부처님오신날',{sub:1})}
  Object.keys(TEMPH).forEach(k=>{if(k.slice(0,4)===String(y))add(k,TEMPH[k])});
  const cnt=ds=>(map[ds]||[]).filter(x=>x.hol).length;
  /* 대체공휴일: 삼일절·어린이날·광복절·개천절·한글날·부처님오신날·성탄절(토·일·중복), 설날·추석 연휴(일요일·중복) */
  const need=[];
  Object.keys(map).sort().forEach(ds=>{const wk=pd(ds).getDay();
    map[ds].forEach(x=>{if(x.sub&&(wk===0||wk===6||cnt(ds)>1)&&!need.some(n=>n.from===ds))need.push({from:ds,name:x.n})})});
  ['seol','chu'].forEach(g=>{const days=Object.keys(map).filter(ds=>map[ds].some(x=>x.grp===g)).sort();
    if(days.length&&days.some(ds=>pd(ds).getDay()===0||cnt(ds)>1))need.push({from:days[days.length-1],name:g==='seol'?'설날':'추석'})});
  need.sort((a,b)=>a.from.localeCompare(b.from)).forEach(n=>{let d=addD(pd(n.from),1);
    for(let i=0;i<10;i++){const k=ymd(d),wk=d.getDay();if(wk!==0&&wk!==6&&!cnt(k))break;d=addD(d,1)}
    if(ymd(d).slice(0,4)===String(y))add(ymd(d),'대체공휴일('+n.name+')')});
  const memo=(m,d,n)=>{const k=y+'-'+pad(m)+'-'+pad(d);(map[k]=map[k]||[]).push({n,hol:false})};
  memo(5,1,'근로자의 날');memo(5,8,'어버이날');memo(5,15,'스승의 날');
  return HC[y]=map}
const holOf=ds=>holidays(+ds.slice(0,4))[ds]||[];
const isHol=ds=>holOf(ds).some(x=>x.hol);
function eventsOn(ds){
  const h=holOf(ds).map((x,i)=>({id:'hd'+ds+i,title:x.n,date:ds,members:[],src:'hd',hol:x.hol}));
  const a=live('events').filter(e=>e.date<=ds&&ds<=(e.end||e.date)).map(e=>({...e,src:'ev'}));
  const b=live('health').filter(x=>x.type==='예약'&&x.date===ds).map(x=>({id:x.id,title:'🏥 '+x.text,date:x.date,members:[x.member],time:x.time||'',src:'hl'}));
  return h.concat(a.concat(b).sort((x,y)=>(x.time||'99').localeCompare(y.time||'99')))}
const evColor=e=>{if(e.src==='hd')return e.hol?'#e5484d':'#8a93a6';const m=mem((e.members||[])[0]);return m?m.color:'#8a93a6'};
const evWho=e=>!(e.members||[]).length?'온 가족':e.members.map(id=>mem(id)).filter(Boolean).map(m=>m.name).join(', ');
function evRow(e,showDate){
  if(e.src==='hd')return `<div class="ev"><div class="bar" style="background:${evColor(e)}"></div><div style="flex:1;min-width:0"><div class="t">${esc(e.title)}</div><div class="muted">${showDate?fmtK(e.date)+' · ':''}${e.hol?'공휴일':'기념일'}</div></div></div>`;
  return `<div class="ev" data-a="${e.src==='hl'?'goHealth':'editEv'}" data-id="${e.id}" data-m="${esc((e.members||[])[0]||'')}" style="cursor:pointer"><div class="bar" style="background:${evColor(e)}"></div><div style="flex:1;min-width:0"><div class="t">${esc(e.title)}</div><div class="muted">${showDate?fmtK(e.date)+' · ':''}${e.time?esc(e.time)+' · ':''}${esc(evWho(e))}${e.memo?' · '+esc(e.memo):''}</div></div></div>`}

/* ============ 날씨 (기상청) ============ */
const WMO=c=>c===0?['☀️','맑음']:c<=2?['🌤️','구름 조금']:c===3?['☁️','흐림']:c<=48?['🌫️','안개']:c<=57?['🌦️','이슬비']:c<=67?['🌧️','비']:c<=77?['🌨️','눈']:c<=82?['🌧️','소나기']:c<=86?['🌨️','눈 소나기']:['⛈️','뇌우'];
let WX=lsGet('famdash.wx',null);
/* 기상청(KMA) 예보 모델 (Open-Meteo 제공) / 실패 시 기본 모델 */
async function omForecast(w,model){
  const u='https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon+(model?'&models='+model:'')+'&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=6';
  const r=await fetch(u);if(!r.ok)throw new Error('om '+r.status);const j=await r.json();
  if(!j.current||!j.daily||j.current.temperature_2m==null||j.daily.temperature_2m_max[0]==null)throw new Error('om empty');
  return {src:model?'kma-om':'om',cur:j.current,daily:j.daily}}
async function loadWx(force){
  const w=D.settings.wx||{};if(!w.lat)return;const k=w.lat+','+w.lon;
  if(!force&&WX&&WX.k===k&&Date.now()-WX.t<1800000)return;
  let res=null;
  if(!res){try{res=await omForecast(w,'kma_seamless')}catch(e){}}
  if(!res){try{res=await omForecast(w,'')}catch(e){}}
  if(res){if(res.cur.weather_code==null)res.cur.weather_code=res.daily.weather_code[0]||0;WX={k,t:Date.now(),...res};lsSet('famdash.wx',WX);if(!modalOpen())render()}}
const wxSrc=()=>!WX?'':WX.src==='kma-om'?'출처: 기상청(KMA) 예보 모델':'출처: Open-Meteo (기상청 데이터를 불러오지 못해 대체)';
function wxCard(){
  const w=D.settings.wx||{};
  if(!WX)return `<div class="card"><h2>🌤️ 날씨</h2><div class="muted">불러오는 중… (${esc(w.name||'')})</div></div>`;
  const c=WX.cur,d=WX.daily,[ic,tx]=WMO(c.weather_code);
  const fc=d.time.map((t,i)=>{const[i2]=WMO(d.weather_code[i]);return `<div><div>${i===0?'오늘':DOW[pd(t).getDay()]}</div><div style="font-size:20px">${i2}</div><div><b>${Math.round(d.temperature_2m_max[i])}°</b> <span class="muted">${Math.round(d.temperature_2m_min[i])}°</span></div><div class="muted">☔${d.precipitation_probability_max[i]||0}%</div></div>`}).join('');
  const rain=(d.precipitation_probability_max[0]||0)>=50;
  return `<div class="card"><h2>${esc(w.name||'날씨')}<span class="sp"></span><span class="muted">${tx}</span></h2><div class="wx"><div class="big">${ic}</div><div><div class="tt2">${Math.round(c.temperature_2m)}°</div><div class="muted">체감 ${Math.round(c.apparent_temperature)}° · 오늘 ${Math.round(d.temperature_2m_min[0])}~${Math.round(d.temperature_2m_max[0])}°</div></div>${rain?'<div style="margin-left:auto;font-size:13px">☂️ 우산 챙기세요</div>':''}</div><div class="fc">${fc}</div><div class="muted" style="margin-top:6px;font-size:11px">${wxSrc()}</div></div>`}

/* ============ 급식 (NEIS) ============ */
const MEALC=lsGet('famdash.meal',{});
function weekRange(off){const t=new Date();const mon=addD(t,-((t.getDay()+6)%7)+off*7);return [mon,addD(mon,4)]}
const compact=d=>ymd(d).replace(/-/g,'');
async function loadMeals(sch,from,to){
  const key=sch.code+'|'+compact(from);const c=MEALC[key];
  if(c&&Date.now()-c.t<6*3600e3)return c.rows;
  const u='https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE='+encodeURIComponent(sch.office)+'&SD_SCHUL_CODE='+encodeURIComponent(sch.code)+'&MMEAL_SC_CODE=2&MLSV_FROM_YMD='+compact(from)+'&MLSV_TO_YMD='+compact(to);
  const r=await fetch(u);if(!r.ok)throw new Error('neis '+r.status);const j=await r.json();
  let rows=[];if(j.mealServiceDietInfo)rows=(j.mealServiceDietInfo[1].row||[]).map(x=>({d:x.MLSV_YMD,dish:x.DDISH_NM,cal:x.CAL_INFO}));
  else if(j.RESULT&&j.RESULT.CODE!=='INFO-200')throw new Error(j.RESULT.MESSAGE||'neis');
  MEALC[key]={t:Date.now(),rows};lsSet('famdash.meal',MEALC);return rows}
const dishes=h=>String(h||'').split(/<br\s*\/?>/i).map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^(.*?)\s*((?:\(?[\d.]+\)?)*)$/);return {n:(m?m[1]:s).replace(/\s*\(?[\d.]+\)?$/,'').trim()||s,a:(s.match(/\(([\d.]+)\)/)||[])[1]||''}});
const schools=()=>{const seen={};return kids().filter(k=>k.school&&k.school.code).filter(k=>seen[k.school.code]?false:(seen[k.school.code]=1)).map(k=>({...k.school,who:kids().filter(x=>x.school&&x.school.code===k.school.code).map(x=>x.name).join(', ')}))};
async function mealHTML(sch,off,onlyToday){
  const[f,t]=weekRange(off);let rows;
  try{rows=await loadMeals(sch,f,t)}catch(e){return `<div class="empty">급식 정보를 불러오지 못했어요.<br><span class="muted">${esc(String(e.message||e).slice(0,80))} · 잠시 후 다시 시도해 주세요</span></div>`}
  const td=compact(new Date());
  if(onlyToday){const r=rows.find(x=>x.d===td);return r?dishes(r.dish).map(x=>esc(x.n)).join(' · '):'<span class="muted">오늘은 급식 정보가 없어요</span>'}
  if(!rows.length)return '<div class="empty">이 주에는 급식 정보가 없어요</div>';
  return rows.map(r=>{const d=pd(r.d.slice(0,4)+'-'+r.d.slice(4,6)+'-'+r.d.slice(6));return `<div class="meal ${r.d===td?'today':''}"><b>${fmtK(ymd(d))}${r.cal?` <span class="muted">${esc(r.cal)}</span>`:''}</b>${dishes(r.dish).map(x=>esc(x.n)+(x.a?`<span class="a"> ${esc(x.a)}</span>`:'')).join(' · ')}</div>`}).join('')}

function winOf(birth,type,a,b){const B=pd(birth);
  if(type==='d')return [addD(B,a),addD(B,b)];
  return [addM(B,a),addD(addM(B,b+1),-1)]}
function vacWin(birth,m,w){const B=pd(birth);return [addM(B,m),addM(B,m+w)]}
const chkRec=(mid,key)=>D.checks.find(c=>c.id===mid+'|'+key&&!c.del);
function doseState(mid,key,s,e){const r=chkRec(mid,key);if(r)return {st:'done',r};const t=pd(TODAY());if(t>e)return {st:'over'};if(t>=addD(s,-14)&&t<=e)return {st:'due'};return {st:'fut'}}
function dueSoon(m){ /* 곧 챙길 건강 일정 */
  if(!m.birth)return [];const out=[];const t=pd(TODAY()),lim=addD(t,45);
  VAC.forEach(v=>v.d.forEach((x,i)=>{const[s,e]=vacWin(m.birth,x[0],x[1]);const key=v.k+i;const st=doseState(m.id,key,s,e);
    if(st.st==='due'||st.st==='over'){if(st.st==='over'&&addM(e,6)<t)return;out.push({name:m.name+' '+v.n+' '+x[2],s,e,over:st.st==='over'})}}));
  CHK.forEach(c=>{const[s,e]=winOf(m.birth,c.w[0],c.w[1],c.w[2]);const st=doseState(m.id,c.k,s,e);
    if(st.st==='due'||(st.st==='over'&&addD(e,60)>=t))out.push({name:m.name+' '+c.n,s,e,over:st.st==='over'})});
  return out.filter(o=>o.s<=lim).sort((a,b)=>a.e-b.e)}

/* SHA-256 (동기 구현) */
function sha256(str){const K=[];const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  let p=2,n=0;while(n<64){let ok=true;for(let i=2;i*i<=p;i++)if(p%i===0){ok=false;break}if(ok){K[n++]=(Math.pow(p,1/3)%1)*4294967296|0}p++}
  const b=Array.from(new TextEncoder().encode(str)),l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  const rr=(x,c)=>(x>>>c)|(x<<(32-c));
  for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let[a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

 addMem(){memForm()},editMem(d){const m=D.members.find(x=>x.id===d.id);if(m)memForm(m)},

 async schSearch(){const q=val('sq').trim();if(!q)return;const out=$('#sres');out.innerHTML='<div class="muted">검색 중…</div>';
   try{const r=await fetch('https://open.neis.go.kr/hub/schoolInfo?Type=json&pSize=20&SCHUL_NM='+encodeURIComponent(q));const j=await r.json();

   catch(e){out.innerHTML='<div class="muted">검색하지 못했어요. 네트워크를 확인하고 잠시 후 다시 시도해 주세요.</div>'}},

 async wxSearch(){const q=val('wxq').trim();if(!q)return;const out=$('#wxres');out.innerHTML='<div class="muted">검색 중…</div>';
   try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=ko&name='+encodeURIComponent(q));const j=await r.json();const rs=j.results||[];

 pickWx(d){WX=null;setSettings({wx:{name:d.n,lat:+d.lat,lon:+d.lon}});loadWx(true);toast('날씨 지역을 바꿨어요')},
 pwCheck(){const v=val('pwIn');if(pwHash(v,D.settings.pwSalt||'')===D.settings.pwHash){UNLOCK=true;render()}else{toast('비밀번호가 맞지 않아요');const i=$('#pwIn');if(i){i.value='';i.focus()}}},
 pwOpen(){const has=!!D.settings.pwHash;
   openModal(`<h2>🔒 설정 비밀번호</h2><div class="muted" style="margin-bottom:8px">설정 탭을 열 때마다 입력해야 해요. 비밀번호는 암호화되어 가족 데이터와 함께 동기화돼요.</div>${has?'<label class="l">현재 비밀번호</label><input type="password" id="pw0" autocomplete="off">':''}<label class="l">새 비밀번호 (4자 이상)</label><input type="password" id="pw1" autocomplete="off"><label class="l">새 비밀번호 확인</label><input type="password" id="pw2" autocomplete="off"><div class="row"><button class="btn pri" style="flex:1" data-a="pwSave">${has?'변경':'설정'}</button>${has?'<button class="btn danger" data-a="pwDel">해제</button>':''}<button class="btn" data-a="close">닫기</button></div>`)},
 pwSave(){const has=!!D.settings.pwHash;if(has&&pwHash(val('pw0'),D.settings.pwSalt||'')!==D.settings.pwHash){toast('현재 비밀번호가 맞지 않아요');return}
   const a=val('pw1');if(a.length<4){toast('4자 이상 입력하세요');return}if(a!==val('pw2')){toast('확인 비밀번호가 달라요');return}
   const salt=uid()+uid();$('#modal').classList.remove('on');$('#box').innerHTML='';UNLOCK=true;setSettings({pwSalt:salt,pwHash:pwHash(a,salt)});toast('비밀번호를 설정했어요')},
 pwDel(){if(pwHash(val('pw0'),D.settings.pwSalt||'')!==D.settings.pwHash){toast('현재 비밀번호가 맞지 않아요');return}
   $('#modal').classList.remove('on');$('#box').innerHTML='';setSettings({pwSalt:'',pwHash:''});toast('비밀번호를 해제했어요')},
 ghOpen(){const g=gh()||{};
   openModal(`<h2>🔗 GitHub 동기화</h2><p class="muted" style="margin-top:0">가족 모두가 같은 저장소·토큰으로 연결하면 서로의 수정이 1분 안에 반영돼요. 건강 정보가 들어 있으니 <b>데이터 저장소는 비공개(private)</b>로 만드세요. 토큰은 이 기기 브라우저에만 저장돼요.</p>
   <label class="l">GitHub 아이디</label><input type="text" id="gO" value="${esc(g.owner||'')}" autocapitalize="off" autocorrect="off">
   <label class="l">데이터 저장소 이름</label><input type="text" id="gR" value="${esc(g.repo||'')}" placeholder="예: family-data" autocapitalize="off" autocorrect="off">
   <label class="l">토큰 (Fine-grained · 이 저장소만 · Contents 읽기/쓰기)</label><input type="password" id="gT" value="${esc(g.token||'')}" autocapitalize="off" autocorrect="off" placeholder="github_pat_…">
   <div class="row"><button class="btn pri" style="flex:1" data-a="saveGh">연결 · 동기화</button>${g.owner?`<button class="btn" data-a="syncNow">지금 동기화</button><button class="btn danger" data-a="clearGh">해제</button>`:''}<button class="btn" data-a="close">닫기</button></div>`)},
 saveGh(){const o=val('gO').trim(),r=val('gR').trim().replace(/\.git$/,''),t=val('gT').trim();if(!GHN.test(o)||!GHN.test(r)){toast('아이디와 저장소 이름을 확인하세요');return}
   $('#modal').classList.remove('on');$('#box').innerHTML='';
   lsSet(K_GH,{owner:o,repo:r,token:t,path:'data/family.json'});S={busy:false,at:0,err:'',sha:null,state:t?'rw':'ro'};dirty=true;toast('연결했어요. 동기화 중…');sync(true).then(render)},
 clearGh(){$('#modal').classList.remove('on');$('#box').innerHTML='';try{localStorage.removeItem(K_GH)}catch(e){}S.err='';S.at=0;toast('연결을 해제했어요 (이 기기의 데이터는 남아요)');render()},
 syncNow(){if(!gh()){toast('먼저 GitHub를 연결하세요');return}$('#modal').classList.remove('on');$('#box').innerHTML='';sync(true).then(render)},
 exportData(){const txt=JSON.stringify(D);openModal(`<h2>백업 내보내기</h2><div class="muted">아래 내용을 전체 복사해서 보관하세요.</div><textarea id="f_x" style="min-height:160px" readonly>${esc(txt)}</textarea><div class="row"><button class="btn pri" data-a="copyX">복사</button><button class="btn" data-a="close">닫기</button></div>`)},
 copyX(){const t=$('#f_x');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('복사했어요'),()=>{document.execCommand('copy');toast('복사했어요')})}catch(e){document.execCommand('copy');toast('복사했어요')}},
 importData(){openModal(`<h2>백업 가져오기</h2><div class="muted">내보낸 내용을 붙여넣으면 현재 데이터와 합쳐요 (더 최근에 수정한 항목이 남아요).</div><textarea id="f_x" style="min-height:160px"></textarea><div class="row"><button class="btn pri" data-a="doImport">가져오기</button><button class="btn" data-a="close">닫기</button></div>`)},
 doImport(){try{const j=JSON.parse(val('f_x'));if(!j||typeof j!=='object')throw 0;$('#modal').classList.remove('on');D=merge(D,j);$('#box').innerHTML='';changed();toast('가져왔어요')}catch(e){toast('형식이 올바르지 않아요')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(!f)return;if(t.tagName==='INPUT'&&t.type==='checkbox')return;f(t.dataset,t,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.chg&&A[t.dataset.chg]){A[t.dataset.chg](t.dataset,t,e);return}if(t.tagName==='INPUT'&&t.type==='checkbox'&&t.dataset.a&&A[t.dataset.a])A[t.dataset.a](t.dataset,t,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.live&&A[t.dataset.live])A[t.dataset.live](t.dataset,t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();A[e.target.dataset.enter](e.target.dataset,e.target,e)}});

/* ============ 시작 ============ */
render();loadWx();
if(gh())sync(false);

/* 와이드 화면 열 너비 조절 */
(function(){let st=null;
  document.addEventListener('pointerdown',e=>{const h=e.target.closest('.rz');if(!h)return;const w=h.closest('.wide');const cols=[...w.querySelectorAll(':scope>.col')];if(cols.length<3)return;
    e.preventDefault();h.setPointerCapture&&h.setPointerCapture(e.pointerId);h.classList.add('drag');
    st={h,w,i:+h.dataset.rz,x:e.clientX,px:cols.map(c=>c.getBoundingClientRect().width)}});
  document.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,p=st.px.slice(),a=st.i,b=a+1,MIN=220;
    let na=p[a]+dx,nb=p[b]-dx;if(na<MIN){nb-=MIN-na;na=MIN}if(nb<MIN){na-=MIN-nb;nb=MIN}p[a]=na;p[b]=nb;
    const tot=p.reduce((x,y)=>x+y,0);const fr=p.map(v=>+(v/tot*3.23).toFixed(3));st.fr=fr;
    st.w.style.setProperty('--c1',fr[0]+'fr');st.w.style.setProperty('--c2',fr[1]+'fr');st.w.style.setProperty('--c3',fr[2]+'fr')});
  const end=()=>{if(!st)return;st.h.classList.remove('drag');if(st.fr){UI.colW=st.fr;saveUI()}st=null};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('dblclick',e=>{if(!e.target.closest('.rz'))return;UI.colW=null;saveUI();render()});
})();

/* 가로 스크롤 영역: 마우스 휠로 좌우 이동 */
document.addEventListener('wheel',e=>{const h=e.target.closest('.hs,.chips.one');if(!h||h.scrollWidth<=h.clientWidth)return;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){h.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
</script>
